name: Live check of production /api/ai
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-live-ai-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call the real production /api/ai endpoint right now
        run: |
          resp=$(curl -sL -X POST https://talentmaponline.org/api/ai \
            -H "Content-Type: application/json" \
            --max-time 55 \
            -d '{
              "task": "dialogue",
              "system": "Reply with exactly one word: PONG",
              "messages": [{"role":"user","content":"ping"}]
            }')
          echo "LIVE AI response: $resp"
