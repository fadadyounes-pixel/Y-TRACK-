name: Recheck AI provider secrets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-recheck-secrets.yml'

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - name: Report lengths only (never values)
        env:
          G: ${{ secrets.GROQ_API_KEY }}
          GE: ${{ secrets.GEMINI_API_KEY }}
          C: ${{ secrets.CEREBRAS_API_KEY }}
          N: ${{ secrets.NVIDIA_API_KEY }}
          A: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "GROQ_API_KEY len=${#G}"
          echo "GEMINI_API_KEY len=${#GE}"
          echo "CEREBRAS_API_KEY len=${#C}"
          echo "NVIDIA_API_KEY len=${#N}"
          echo "ANTHROPIC_API_KEY len=${#A}"
