name: Verify talentmaponline.org is live and AI agents respond
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-live.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Homepage responds
        run: |
          code=$(curl -sL -o /tmp/home.html -w "%{http_code}" https://talentmaponline.org/ --max-time 20)
          echo "GET / -> $code"
          test "$code" = "200"
          grep -qi "talentmap" /tmp/home.html && echo "OK: homepage mentions TalentMap" || (echo "FAIL: TalentMap not found in homepage" && exit 1)

      - name: Login page responds
        run: |
          code=$(curl -sL -o /tmp/login.html -w "%{http_code}" https://talentmaponline.org/login --max-time 20)
          echo "GET /login -> $code"
          test "$code" = "200"

      - name: Admin dashboard route responds
        run: |
          code=$(curl -sL -o /dev/null -w "%{http_code}" https://talentmaponline.org/admin --max-time 20)
          echo "GET /admin -> $code"
          test "$code" = "200"

      - name: Coordinator dashboard route responds
        run: |
          code=$(curl -sL -o /dev/null -w "%{http_code}" https://talentmaponline.org/coordinator --max-time 20)
          echo "GET /coordinator -> $code"
          test "$code" = "200"

      - name: Auth API — candidate CIN login works
        run: |
          resp=$(curl -sL -X POST https://talentmaponline.org/api/auth \
            -H "Content-Type: application/json" \
            -d '{"code":"AB1234"}' --max-time 20)
          echo "auth candidate response: $resp"
          echo "$resp" | grep -q '"ok":true' && echo "OK: candidate login works" || (echo "FAIL: candidate login broken" && exit 1)
          echo "$resp" | grep -q '"role":"candidate"' || (echo "FAIL: role not candidate" && exit 1)

      - name: Auth API — admin login works
        run: |
          resp=$(curl -sL -X POST https://talentmaponline.org/api/auth \
            -H "Content-Type: application/json" \
            -d '{"code":"ADMIN001"}' --max-time 20)
          echo "auth admin response: $resp"
          echo "$resp" | grep -q '"role":"admin"' && echo "OK: admin login works" || (echo "FAIL: admin login broken" && exit 1)

      - name: Auth API — invalid code correctly rejected
        run: |
          resp=$(curl -sL -X POST https://talentmaponline.org/api/auth \
            -H "Content-Type: application/json" \
            -d '{"code":"NOTAREALCODE"}' --max-time 20)
          echo "auth invalid response: $resp"
          echo "$resp" | grep -q '"ok":false' && echo "OK: invalid code rejected" || (echo "FAIL: invalid code not rejected" && exit 1)

      - name: AI agent — /api/ai responds with real content
        run: |
          resp=$(curl -sL -X POST https://talentmaponline.org/api/ai \
            -H "Content-Type: application/json" \
            --max-time 55 \
            -d '{
              "task": "dialogue",
              "system": "Reply with exactly one word: PONG",
              "messages": [{"role":"user","content":"ping"}]
            }')
          echo "AI response: $resp"
          echo "$resp" | grep -q '"text"' && echo "OK: AI agent returned text" || (echo "FAIL: AI agent did not return text" && exit 1)
          text=$(echo "$resp" | grep -o '"text":"[^"]*"' | head -1)
          if [ -z "$text" ]; then
            echo "FAIL: text field empty"
            exit 1
          fi
          echo "AI text field: $text"
