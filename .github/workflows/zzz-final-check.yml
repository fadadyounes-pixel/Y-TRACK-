name: zzz final sanity check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/zzz-final-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Homepage + AI both live
        run: |
          hcode=$(curl -sL -o /dev/null -w "%{http_code}" https://talentmaponline.org/ --max-time 20)
          echo "GET / -> $hcode"
          resp=$(curl -sL -X POST https://talentmaponline.org/api/ai \
            -H "Content-Type: application/json" \
            --max-time 55 \
            -d '{"task":"dialogue","system":"Reply with exactly one word: PONG","messages":[{"role":"user","content":"ping"}]}')
          echo "AI response: $resp"
