name: Deploy Y-TRACK to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config*'
      - 'tsconfig.json'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:
    inputs:
      vercel_token:
        description: 'Vercel Token'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ inputs.vercel_token || secrets.VERCEL_TOKEN }}
        run: vercel --token "$VERCEL_TOKEN" --prod --yes

      # Diagnostic only — lists which env var NAMES exist in the Production
      # environment (never values). Used to confirm whether any AI provider
      # key is actually configured, since the app's AI cascade is otherwise
      # unreachable to inspect from outside Vercel's dashboard.
      - name: List configured Production env vars (names only)
        env:
          VERCEL_TOKEN: ${{ inputs.vercel_token || secrets.VERCEL_TOKEN }}
        run: vercel env ls production --token "$VERCEL_TOKEN" || true

      # Diagnostic only — lists every Vercel project visible to this token, in case
      # env vars were added to a different project than the one actually deployed.
      - name: List all Vercel projects visible to this token
        env:
          VERCEL_TOKEN: ${{ inputs.vercel_token || secrets.VERCEL_TOKEN }}
        run: vercel project ls --token "$VERCEL_TOKEN" || true

      # Diagnostic only — a second project (y-track-ynip) showed up above, recently
      # updated. Check whether the user's env vars landed there instead of on the
      # actually-deployed "y-track" project.
      - name: Check env vars on y-track-ynip specifically
        env:
          VERCEL_TOKEN: ${{ inputs.vercel_token || secrets.VERCEL_TOKEN }}
        run: |
          rm -rf .vercel
          vercel link --token "$VERCEL_TOKEN" --yes --project y-track-ynip || true
          vercel env ls production --token "$VERCEL_TOKEN" || true

      # Diagnostic only — the token also sees talentmaponline, career-map, and
      # x-track projects. Check each in case the Upstash credentials were saved
      # to the wrong project by mistake.
      - name: Check env vars on every other visible project
        env:
          VERCEL_TOKEN: ${{ inputs.vercel_token || secrets.VERCEL_TOKEN }}
        run: |
          for p in talentmaponline career-map x-track; do
            echo "=== $p ==="
            rm -rf .vercel
            vercel link --token "$VERCEL_TOKEN" --yes --project "$p" || true
            vercel env ls production --token "$VERCEL_TOKEN" || true
          done
      # Diagnostic only — the user reported ERR_CONNECTION_TIMED_OUT hitting
      # www.ideamaponline.org from their browser after the Redis env vars were
      # added. Check whether the live site is actually reachable and fast from
      # an independent network (GitHub's runner), to rule out a real outage
      # vs. a local network/proxy issue on the user's end.
      - name: Check live site reachability
        run: |
          echo "=== HEAD request timing ==="
          curl -sS -o /dev/null -w "http_code=%{http_code} time_total=%{time_total}s time_connect=%{time_connect}s\n" --max-time 20 https://www.ideamaponline.org/ || echo "curl failed"
          echo "=== Response headers ==="
          curl -sS -I --max-time 20 https://www.ideamaponline.org/ || echo "curl failed"
      # Diagnostic only — user reports ERR_CONNECTION_TIMED_OUT on the custom
      # domain from BOTH wifi and mobile data, which rules out a single local
      # network issue. Check the domain's verification/config status, and
      # test the project's default *.vercel.app alias (which bypasses the
      # custom domain's DNS entirely) so the user has an alternate URL to try
      # and we can isolate whether this is a custom-domain-specific problem.
      - name: Inspect domain config and test vercel.app alias
        env:
          VERCEL_TOKEN: ${{ inputs.vercel_token || secrets.VERCEL_TOKEN }}
        run: |
          echo "=== Domain inspect: ideamaponline.org ==="
          vercel domains inspect ideamaponline.org --token "$VERCEL_TOKEN" || true
          echo "=== Domain inspect: www.ideamaponline.org ==="
          vercel domains inspect www.ideamaponline.org --token "$VERCEL_TOKEN" || true
          echo "=== All domains on this account ==="
          vercel domains ls --token "$VERCEL_TOKEN" || true
          echo "=== Testing y-track.vercel.app alias ==="
          curl -sS -o /dev/null -w "http_code=%{http_code} time_total=%{time_total}s\n" --max-time 20 https://y-track.vercel.app/ || echo "curl failed"
      # Diagnostic only — the assistant's own sandbox has no outbound access to
      # WHOIS/RDAP lookup services, so identify the domain's registrar here
      # instead, using this runner's unrestricted internet access. Needed to
      # give the user exact steps for fixing the domain's nameservers.
      - name: Look up domain registrar via RDAP
        run: |
          set +e
          echo "=== 1) direct PIR (.org registry) RDAP ==="
          curl -sSL --max-time 10 "https://rdap.publicinterestregistry.org/rdap/domain/ideamaponline.org" -o /tmp/rdap2.json
          python3 -m json.tool /tmp/rdap2.json 2>&1 || cat /tmp/rdap2.json 2>&1 || echo "(no output)"
          echo ""
          echo "=== 2) rdap.org bootstrap ==="
          curl -sSL --max-time 10 "https://rdap.org/domain/ideamaponline.org" -o /tmp/rdap1.json
          python3 -m json.tool /tmp/rdap1.json 2>&1 || cat /tmp/rdap1.json 2>&1 || echo "(no output)"
          echo ""
          echo "=== 3) who-dat free WHOIS JSON API ==="
          curl -sSL --max-time 10 "https://who-dat.as93.net/ideamaponline.org" -o /tmp/whois1.json
          python3 -m json.tool /tmp/whois1.json 2>&1 || cat /tmp/whois1.json 2>&1 || echo "(no output)"
          exit 0
      # Diagnostic only — the "100+ concurrent users" resilience goal has been
      # addressed at the code level (PR #55: local instant fallbacks, capped
      # in-flight AI calls, no client polling) but was never verified against
      # the live production site. Run a bounded, read-only concurrency test
      # here (this runner has real internet access, unlike the assistant's
      # sandbox) to get real evidence: 100 concurrent GET requests against the
      # production /ideamap page, no AI calls and no writes, so this is safe
      # (trivial load for any CDN, no cost, no data mutation) and reports
      # success rate + latency percentiles.
      - name: Load test — 100 concurrent requests to production /ideamap
        run: |
          set +e
          URL="https://www.ideamaponline.org/ideamap"
          N=100
          OUT=/tmp/loadtest_results.txt
          : > "$OUT"
          echo "=== Firing $N concurrent GET requests at $URL ==="
          seq 1 $N | xargs -P $N -I{} curl -sS -o /dev/null \
            -w "%{http_code} %{time_total}\n" --max-time 30 "$URL" >> "$OUT" 2>/tmp/loadtest_errors.txt
          echo "=== Raw results ($(wc -l < "$OUT") responses received out of $N requests) ==="
          cat "$OUT"
          echo ""
          echo "=== curl errors (if any) ==="
          cat /tmp/loadtest_errors.txt || true
          echo ""
          echo "=== Summary ==="
          RECEIVED=$(wc -l < "$OUT")
          echo "Responses received: $RECEIVED / $N"
          echo "Status code breakdown:"
          awk '{print $1}' "$OUT" | sort | uniq -c | sort -rn
          OK=$(awk '$1 ~ /^2/' "$OUT" | wc -l)
          if [ "$RECEIVED" -gt 0 ]; then
            echo "Success rate (2xx): $OK/$RECEIVED"
            echo "Latency percentiles (sorted times):"
            sort -n -k2,2 -t' ' "$OUT" | awk '{print $2}' > /tmp/loadtest_times.txt
            N_TIMES=$(wc -l < /tmp/loadtest_times.txt)
            for P in 50 90 99; do
              IDX=$(( (P * N_TIMES) / 100 ))
              [ "$IDX" -ge "$N_TIMES" ] && IDX=$((N_TIMES - 1))
              [ "$IDX" -lt 0 ] && IDX=0
              VAL=$(sed -n "$((IDX + 1))p" /tmp/loadtest_times.txt)
              echo "  p${P} = ${VAL}s"
            done
            echo "  min = $(head -1 /tmp/loadtest_times.txt)s"
            echo "  max = $(tail -1 /tmp/loadtest_times.txt)s"
          else
            echo "No responses received at all."
          fi
          exit 0
      # Diagnostic only — CEREBRAS_API_KEY and MISTRAL_API_KEY were just added in the
      # Vercel dashboard (production env vars) for AI-provider redundancy alongside the
      # existing GROQ_API_KEY. This step never touches the raw key values (this is a
      # public repo, so no secret may ever appear in workflow inputs or logs) — it only
      # confirms (a) Vercel's latest production deployment succeeded after the env var
      # change, and (b) the live /api/ai cascade still responds correctly end-to-end.
      - name: Verify latest production deployment and AI endpoint health
        env:
          VERCEL_TOKEN: ${{ inputs.vercel_token || secrets.VERCEL_TOKEN }}
        run: |
          echo "=== Latest production deployments ==="
          vercel ls y-track --token "$VERCEL_TOKEN" --prod 2>&1 | head -10 || true
          echo ""
          echo "=== Live /api/ai health check (no secrets involved, just a trivial prompt) ==="
          curl -sS -X POST https://www.ideamaponline.org/api/ai \
            -H "Content-Type: application/json" \
            -d '{"task":"fast","messages":[{"role":"user","content":"Reply with exactly: OK"}],"system":"Reply with exactly the word OK, nothing else."}' \
            -w "\nhttp_code=%{http_code} time=%{time_total}s\n" --max-time 30 || echo "curl failed"
      # Diagnostic only — confirms the app/ideamap/layout.tsx title override (PR #66)
      # is actually live on production. middleware.ts transparently rewrites every
      # path on ideamaponline.org (including "/") to /ideamap, so BOTH URLs below
      # are expected to read "IdeaMap" — that's correct, not a bug. TalentMap is a
      # fully separate domain (talentmaponline.org) untouched by this change, so
      # that's the one that must still read "TalentMap" unchanged.
      - name: Verify browser tab titles on production (TalentMap vs IdeaMap)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          echo "=== Title of https://www.talentmaponline.org/ (TalentMap — must stay unchanged) ==="
          curl -sS -A "$UA" -H "Accept-Language: en-US,en;q=0.9" --max-time 20 https://www.talentmaponline.org/ -o /tmp/talentmap.html -w "http_code=%{http_code}\n"
          grep -oE '<title>[^<]*</title>' /tmp/talentmap.html || echo "no title found (see status code above)"
          echo ""
          echo "=== Title of https://www.ideamaponline.org/ (rewritten to /ideamap — must read IdeaMap) ==="
          curl -sS -A "$UA" -H "Accept-Language: en-US,en;q=0.9" --max-time 20 https://www.ideamaponline.org/ -o /tmp/root.html -w "http_code=%{http_code}\n"
          grep -oE '<title>[^<]*</title>' /tmp/root.html || echo "no title found (see status code above)"
          echo ""
          echo "=== Title of https://www.ideamaponline.org/ideamap (must read IdeaMap) ==="
          curl -sS -A "$UA" -H "Accept-Language: en-US,en;q=0.9" --max-time 20 https://www.ideamaponline.org/ideamap -o /tmp/ideamap.html -w "http_code=%{http_code}\n"
          grep -oE '<title>[^<]*</title>' /tmp/ideamap.html || echo "no title found (see status code above)"
      # Diagnostic only — the plain-curl check above keeps hitting Vercel's bot-protection
      # challenge page on ideamaponline.org (http_code=403, "Vercel Security Checkpoint")
      # even with a realistic browser User-Agent, because that challenge requires actually
      # executing JavaScript — something curl can never do regardless of headers. This step
      # uses a real headless browser (Playwright, already a project dependency) so the
      # challenge gets solved the way a genuine visitor's browser would, letting us read
      # the real rendered <title> instead of the challenge page's title.
      - name: Verify browser tab titles on production via headless browser
        run: |
          npx playwright install --with-deps chromium
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const urls = [
              'https://www.talentmaponline.org/',
              'https://www.ideamaponline.org/',
              'https://www.ideamaponline.org/ideamap',
            ];
            for (const url of urls) {
              try {
                const resp = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
                console.log('=== ' + url + ' ===');
                console.log('status=' + (resp ? resp.status() : 'null'));
                console.log('title=' + (await page.title()));
              } catch (e) {
                console.log('=== ' + url + ' ===');
                console.log('ERROR: ' + e.message);
              }
            }
            await browser.close();
          })();
          "
      # (re-check: latest status ping 30 — add a Playwright headless-browser title check, since curl can never pass Vercel's JS-based bot challenge no matter the User-Agent, non-fatal)
