name: Diagnose whether configured AI provider keys actually work
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-provider-keys.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Test GROQ_API_KEY directly against Groq
        env:
          K: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$K" ]; then echo "GROQ: secret empty"; exit 0; fi
          code=$(curl -s -o /tmp/groq.json -w "%{http_code}" https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $K" -H "Content-Type: application/json" \
            -d '{"model":"llama-3.1-8b-instant","max_tokens":5,"messages":[{"role":"user","content":"say OK"}]}' --max-time 15)
          echo "GROQ status: $code"
          cat /tmp/groq.json

      - name: Test GEMINI_API_KEY directly against Gemini
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$K" ]; then echo "GEMINI: secret empty"; exit 0; fi
          code=$(curl -s -o /tmp/gemini.json -w "%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=$K" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"role":"user","parts":[{"text":"say OK"}]}],"generationConfig":{"maxOutputTokens":5}}' --max-time 15)
          echo "GEMINI status: $code"
          cat /tmp/gemini.json

      - name: Test CEREBRAS_API_KEY directly against Cerebras
        env:
          K: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          if [ -z "$K" ]; then echo "CEREBRAS: secret empty"; exit 0; fi
          code=$(curl -s -o /tmp/cerebras.json -w "%{http_code}" https://api.cerebras.ai/v1/chat/completions \
            -H "Authorization: Bearer $K" -H "Content-Type: application/json" \
            -d '{"model":"llama3.1-8b","max_tokens":5,"messages":[{"role":"user","content":"say OK"}]}' --max-time 15)
          echo "CEREBRAS status: $code"
          cat /tmp/cerebras.json

      - name: Test NVIDIA_API_KEY directly against NVIDIA NIM
        env:
          K: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "$K" ]; then echo "NVIDIA: secret empty"; exit 0; fi
          code=$(curl -s -o /tmp/nvidia.json -w "%{http_code}" https://integrate.api.nvidia.com/v1/chat/completions \
            -H "Authorization: Bearer $K" -H "Content-Type: application/json" \
            -d '{"model":"meta/llama-3.1-8b-instruct","max_tokens":5,"messages":[{"role":"user","content":"say OK"}]}' --max-time 15)
          echo "NVIDIA status: $code"
          cat /tmp/nvidia.json
