name: zzz comprehensive site check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/zzz-comprehensive-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Core routes
        run: |
          for path in / /login /admin /coordinator /jobs /candidates; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" "https://talentmaponline.org$path" --max-time 20)
            echo "GET $path -> $code"
          done

      - name: Auth API
        run: |
          echo "-- candidate --"
          curl -sL -X POST https://talentmaponline.org/api/auth -H "Content-Type: application/json" -d '{"code":"AB1234"}' --max-time 20
          echo ""
          echo "-- admin --"
          curl -sL -X POST https://talentmaponline.org/api/auth -H "Content-Type: application/json" -d '{"code":"ADMIN001"}' --max-time 20
          echo ""
          echo "-- invalid --"
          curl -sL -X POST https://talentmaponline.org/api/auth -H "Content-Type: application/json" -d '{"code":"GARBAGE"}' --max-time 20
          echo ""

      - name: AI endpoint
        run: |
          resp=$(curl -sL -X POST https://talentmaponline.org/api/ai \
            -H "Content-Type: application/json" \
            --max-time 55 \
            -d '{"task":"dialogue","system":"Reply with exactly one word: PONG","messages":[{"role":"user","content":"ping"}]}')
          echo "AI response: $resp"

      - name: IdeaMap isolation check (must not leak TalentMap content)
        run: |
          code=$(curl -sL -o /tmp/ideamap.html -w "%{http_code}" https://talentmaponline.org/ideamap --max-time 20)
          echo "GET /ideamap -> $code"
