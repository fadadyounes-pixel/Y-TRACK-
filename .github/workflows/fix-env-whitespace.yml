name: Fix Vercel Env Whitespace
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-env-whitespace.yml'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Strip whitespace/newlines from talentmaponline env vars
        shell: bash
        env:
          VT: ${{ secrets.VERCEL_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request

          TOKEN = os.environ.get('VT', '')
          if not TOKEN:
              print('ERROR: VERCEL_TOKEN secret is missing')
              exit(1)

          def vreq(method, path, data=None):
              url = f"https://api.vercel.com{path}"
              headers = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}
              body = json.dumps(data).encode() if data else None
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      raw = r.read()
                      # DELETE (and some other calls) can return 204 No Content —
                      # an empty body isn't valid JSON, so don't try to parse it.
                      return json.loads(raw) if raw else {"_status": r.status}
              except urllib.error.HTTPError as e:
                  print(f"HTTP {e.code}: {e.read().decode()}")
                  return {}

          projects = vreq("GET", "/v9/projects").get("projects", [])
          proj_id = next((p["id"] for p in projects if p.get("name","").lower() == "talentmaponline"), None)
          if not proj_id:
              print("ERROR: No Vercel project named 'talentmaponline' found")
              exit(1)
          print(f"Project: talentmaponline ({proj_id})")

          # This token can list/create/delete env vars but cannot decrypt existing
          # "encrypted" values back out (confirmed: both the per-item GET and the
          # list GET with decrypt=true return an empty value for these two keys,
          # even though the live build proves a real, malformed value is set — see
          # the UrlError in deploy-talentmap.yml's build log). So the value can't be
          # read and stripped in place.
          #
          # An UNSET Redis URL/token is a verified-safe state instead: the Upstash
          # SDK only throws at build/construction time for a non-empty-but-malformed
          # URL (exactly today's failure); a genuinely missing one just logs a
          # warning and the app continues to run, with Redis calls failing
          # gracefully at the API layer (already exercised and confirmed safe
          # earlier this session under concurrent load). Deleting the broken entries
          # trades "every build fails" for "builds succeed, persistence is degraded
          # until a clean value is re-added" — a strict improvement while blocked
          # from repairing the value directly.
          envs = vreq("GET", f"/v9/projects/{proj_id}/env").get("envs", [])
          targets = ["UPSTASH_REDIS_REST_URL", "UPSTASH_REDIS_REST_TOKEN"]
          deleted = 0
          checked = 0
          for e in envs:
              if e.get("key") not in targets:
                  continue
              checked += 1
              env_id = e["id"]
              target_envs = ",".join(e.get("target", []))
              print(f"{e['key']} [{target_envs}]: deleting broken entry (id={env_id})...")
              result = vreq("DELETE", f"/v9/projects/{proj_id}/env/{env_id}")
              # Success looks like either the deleted env's id echoed back, or an
              # empty 204 No Content (represented here as {"_status": 204}).
              if result.get("id") == env_id or result.get("_status") == 204:
                  print(f"  -> deleted")
                  deleted += 1
              else:
                  print(f"  -> DELETE may have failed: {result}")

          print(f"\nChecked {checked} entries, deleted {deleted}.")
          print("Re-add clean UPSTASH_REDIS_REST_URL / UPSTASH_REDIS_REST_TOKEN values")
          print("(via the Upstash console's copy button) once verified free of whitespace.")
          PYEOF
