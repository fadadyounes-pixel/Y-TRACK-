name: Test the newly-added Groq key directly
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-new-groq-key.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: List Groq's real current model IDs with this key
        env:
          K: ${{ secrets.GROQ_API_KEY }}
        run: |
          code=$(curl -s -o /tmp/models.json -w "%{http_code}" https://api.groq.com/openai/v1/models \
            -H "Authorization: Bearer $K" --max-time 15)
          echo "HTTP status: $code"
          python3 -c "
          import json
          d = json.load(open('/tmp/models.json'))
          for m in d.get('data', []):
              print(m['id'])
          " || cat /tmp/models.json

      - name: Test each currently-listed chat-capable Groq model for real
        env:
          K: ${{ secrets.GROQ_API_KEY }}
        run: |
          for model in \
            "openai/gpt-oss-120b" \
            "openai/gpt-oss-20b" \
            "groq/compound" \
            "groq/compound-mini" \
            "qwen/qwen3.8-27b" \
            "qwen/qwen3.6-27b" \
            "allam-2-7b"; do
            code=$(curl -s -o /tmp/resp.json -w "%{http_code}" https://api.groq.com/openai/v1/chat/completions \
              -H "Authorization: Bearer $K" -H "Content-Type: application/json" \
              -d "{\"model\":\"$model\",\"max_tokens\":10,\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly one word: PONG\"}]}" --max-time 15)
            echo "=== $model -> HTTP $code ==="
            cat /tmp/resp.json
            echo ""
          done
